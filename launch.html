<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>NEXORA Hands</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1013;color:#f4f7fb;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(520px,calc(100% - 32px));background:#15191e;border:1px solid #2a3038;border-radius:14px;padding:30px}h1{margin:0 0 8px;font-size:28px}.sub{color:#9aa7b7;margin:0 0 26px;line-height:1.5}button{width:100%;padding:13px 16px;border:1px solid #3a424d;border-radius:9px;background:#20262d;color:#fff;font-size:15px;font-weight:600;cursor:pointer}button:hover{background:#29313a}.hint{margin:18px 0 0;color:#8491a1;font-size:13px;line-height:1.5}#status{min-height:20px;margin:16px 0 0;color:#72df98;font-size:14px}</style></head><body><main class="card"><h1>NEXORA Hands</h1><p class="sub">Подключите этот компьютер к NEXORA Hands.</p><button id="download">Подключить этот компьютер</button><p id="status"></p><p class="hint">После скачивания запустите файл NEXORA-Hands.cmd. Не закрывайте окно NEXORA Hands во время удалённой работы.</p></main><script>const cmd=String.raw`@echo off
setlocal
set "BOOTSTRAP=%TEMP%\NEXORA-Hands-remote.ps1"
curl.exe -fL --retry 2 --connect-timeout 15 "https://raw.githubusercontent.com/nexora-kz/NEXORA-Hands/main/remote.ps1" -o "%BOOTSTRAP%"
if errorlevel 1 goto :fail
powershell.exe -NoProfile -ExecutionPolicy RemoteSigned -File "%BOOTSTRAP%"
set "RC=%ERRORLEVEL%"
del /q "%BOOTSTRAP%" >nul 2>&1
if not "%RC%"=="0" pause
exit /b %RC%
:fail
echo NEXORA Hands - download failed.
pause
exit /b 1
`;document.getElementById('download').onclick=()=>{const b=new Blob([cmd],{type:'application/octet-stream'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='NEXORA-Hands.cmd';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000);document.getElementById('status').textContent='Файл готов. Запустите NEXORA-Hands.cmd.'};</script></body></html>
