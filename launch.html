<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>NEXORA Hands</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 60px auto; padding: 0 20px; }
    button, a { padding: 12px 18px; font-size: 16px; cursor: pointer; }
    .step { margin: 12px 0; }
    #status { margin-top: 18px; }
  </style>
</head>
<body>
  <h2>NEXORA Hands</h2>
  <div class="step">1. Нажмите кнопку.</div>
  <div class="step">2. Запустите скачанный <b>NEXORA-Hands.cmd</b>.</div>
  <div class="step">3. Оставьте открытым окно PowerShell — в нём будет работать Hands.</div>
  <p><button id="download" type="button">СКАЧАТЬ NEXORA HANDS</button></p>
  <p id="status"></p>
  <script>
    const cmd = String.raw`@echo off
setlocal
powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "irm https://raw.githubusercontent.com/nexora-kz/NEXORA-Hands/main/remote.ps1 | iex"
if errorlevel 1 (
  echo.
  echo NEXORA Hands failed to start. Press any key to close.
  pause >nul
)
`;
    document.getElementById('download').onclick = function () {
      const blob = new Blob([cmd], {type: 'application/octet-stream'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'NEXORA-Hands.cmd';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      document.getElementById('status').textContent = 'NEXORA-Hands.cmd скачивается.';
    };
  </script>
</body>
</html>
