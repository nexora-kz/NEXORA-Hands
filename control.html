<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA Hands Control Center</title><style>body{font-family:system-ui,sans-serif;margin:24px;background:#111;color:#eee}button,input,textarea{font:inherit;background:#1d1d1d;color:#eee;border:1px solid #444;border-radius:6px;padding:9px}textarea{width:100%;height:180px;box-sizing:border-box}.panel{background:#181818;border:1px solid #333;border-radius:8px;padding:14px;margin:12px 0}.worker{padding:10px;border:1px solid #333;border-radius:6px;margin:7px 0;cursor:pointer}.online{color:#8f8}.offline{color:#888}.out{white-space:pre-wrap;background:#0b0b0b;padding:10px;min-height:180px}</style></head><body><h2>NEXORA Hands Control Center</h2><div class="panel"><button onclick="loadWorkers()">Обновить ПК</button><span id="auth"></span></div><div class="panel"><div id="workers">Загрузка...</div></div><div class="panel"><b id="selected">ПК не выбран</b><p><input id="command" value="$env:COMPUTERNAME" style="width:100%;box-sizing:border-box"></p><button onclick="runCommand()">Выполнить PowerShell</button><pre id="output" class="out"></pre></div><script>const API='https://igeddbknrctsdufieosg.supabase.co/functions/v1/nexora-hands-control-v2';let selected=null;async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...extra})});const j=await r.json().catch(()=>({error:'invalid response'}));if(!r.ok)throw Error(j.error||('HTTP '+r.status));return j}async function loadWorkers(){try{const j=await api('list_workers'),box=document.getElementById('workers');box.innerHTML='';for(const w of j.workers){const d=document.createElement('div');d.className='worker';const on=w.last_seen_at&&(Date.now()-Date.parse(w.last_seen_at)<90000);d.innerHTML='<b>'+esc(w.worker_id)+'</b><br><span class="'+(on?'online':'offline')+'">'+(on?'ONLINE':'OFFLINE')+'</span>';d.onclick=()=>{selected=w.worker_id;document.getElementById('selected').textContent=w.worker_id};box.appendChild(d)}}catch(e){document.getElementById('auth').textContent=e.message}}async function runCommand(){if(!selected)return;const task='cc-'+Date.now()+'-'+Math.random().toString(16).slice(2);document.getElementById('output').textContent='Отправлено: '+task;try{await api('command',{task_id:task,worker_id:selected,command:{operation:'shell',command:document.getElementById('command').value}});for(let i=0;i<60;i++){await new Promise(r=>setTimeout(r,1000));const j=await api('status',{task_id:task}),s=j.status||{};if(s.status==='completed'||s.status==='error'||s.command?.status==='completed'||s.command?.status==='error'||s.result){document.getElementById('output').textContent=JSON.stringify(s,null,2);return}}document.getElementById('output').textContent='Тайм-аут ожидания результата.'}catch(e){document.getElementById('output').textContent=e.message}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}loadWorkers();</script></body></html>
