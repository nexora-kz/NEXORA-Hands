<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA Hands</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d0f12;color:#f3f5f7;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:1180px;margin:0 auto;padding:32px 22px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}h1{font-size:24px;margin:0}.muted{color:#8b929b}.layout{display:grid;grid-template-columns:minmax(280px,34%) 1fr;gap:12px;align-items:start}.card{background:#15181c;border:1px solid #292e35;border-radius:12px;padding:16px;margin:0}.workers-card{min-height:430px}.command-card{min-height:430px}.toolbar{display:flex;gap:10px;align-items:center}button,input{font:inherit;color:inherit;background:#1d2126;border:1px solid #343a43;border-radius:8px;padding:10px 12px}button{cursor:pointer}button:hover{background:#252a31}.worker{display:grid;grid-template-columns:1fr auto;gap:8px;padding:14px;border:1px solid #292e35;border-radius:10px;margin:8px 0;cursor:pointer}.worker:hover,.worker.active{border-color:#66717e;background:#1a1e23}.name{font-weight:650}.id{font:12px ui-monospace,Consolas,monospace;color:#7f8791;margin-top:5px}.online{color:#70d88b;font-weight:700}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#70d88b;margin-right:7px}.command{width:100%}.out{white-space:pre-wrap;background:#090b0d;border-radius:8px;padding:14px;min-height:120px;overflow:auto}.empty{padding:28px;text-align:center;color:#8b929b}@media(max-width:800px){.layout{grid-template-columns:1fr}.workers-card,.command-card{min-height:0}}@media(max-width:650px){header{align-items:start;gap:14px;flex-direction:column}.toolbar{width:100%}.toolbar button{width:100%}}
</style>
</head>
<body><div class="wrap">
<header><div><h1>NEXORA Hands</h1><div class="muted">Подключённые компьютеры</div></div><div class="toolbar"><span id="summary" class="muted"></span><button onclick="loadWorkers()">Обновить</button></div></header>
<div class="layout"><div class="card workers-card"><div id="workers" class="empty">Проверка подключений…</div></div><div class="card command-card"><div id="selected" class="muted">Выберите компьютер</div><p><input id="command" class="command" value="$env:COMPUTERNAME"></p><button onclick="runCommand()">Выполнить PowerShell</button><pre id="output" class="out"></pre></div></div></div><script>
const API='https://igeddbknrctsdufieosg.supabase.co/functions/v1/nexora-hands-control-v2';
const ONLINE_MS=90000; let selected=null; const hostNames={"nexora-hands-bf69a451a7744955bf7b63639dd3b06e":"LAPTOP-PJ1VRBPC","nexora-hands-7e8490ee8a03424b9026e4d7f8d45d37":"DESKTOP-PQU4USG"};
async function api(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...extra})});const j=await r.json().catch(()=>({error:'Некорректный ответ сервера'}));if(!r.ok)throw Error(j.error||('HTTP '+r.status));return j}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function loadWorkers(){const box=document.getElementById('workers');box.className='empty';box.textContent='Проверка подключений…';try{const j=await api('list_workers');const online=(j.workers||[]).filter(w=>w.enabled!==false&&w.last_seen_at&&(Date.now()-Date.parse(w.last_seen_at)<ONLINE_MS));document.getElementById('summary').textContent='В сети: '+online.length;box.innerHTML='';box.className='';if(!online.length){box.className='empty';box.textContent='Нет подключённых компьютеров';selected=null;document.getElementById('selected').textContent='Выберите компьютер';return}for(const w of online){const d=document.createElement('div');d.className='worker'+(selected===w.worker_id?' active':'');d.innerHTML='<div><div class="name">'+esc(hostNames[w.worker_id]||'Компьютер')+'</div><div class="id">'+esc(w.worker_id)+'</div></div><div class="online"><span class="dot"></span>В СЕТИ</div>';d.onclick=()=>{selected=w.worker_id;document.getElementById('selected').textContent='Выбран: '+w.worker_id;document.querySelectorAll('.worker').forEach(x=>x.classList.remove('active'));d.classList.add('active')};box.appendChild(d)}}catch(e){box.className='empty';box.textContent='Ошибка: '+e.message}}
async function runCommand(){if(!selected){document.getElementById('output').textContent='Сначала выберите компьютер.';return}const task='cc-'+Date.now()+'-'+Math.random().toString(16).slice(2);const out=document.getElementById('output');out.textContent='Выполнение…';try{await api('command',{task_id:task,worker_id:selected,command:{operation:'powershell',command:document.getElementById('command').value}});for(let i=0;i<60;i++){await new Promise(r=>setTimeout(r,1000));const j=await api('status',{task_id:task}),s=j.status||{};if(s.status==='completed'||s.status==='error'||s.command?.status==='completed'||s.command?.status==='error'||s.result){out.textContent=JSON.stringify(s,null,2);return}}out.textContent='Превышено время ожидания.'}catch(e){out.textContent='Ошибка: '+e.message}}
loadWorkers();setInterval(loadWorkers,30000);
</script></body></html>
